# Local isolation Broker for TASK-008 only (bound via compose to 127.0.0.1).
# Anonymous allowed only because Docker Desktop bind-mounts of single files are
# often not chown-able by the eclipse-mosquitto entrypoint; do not expose this
# listener on non-loopback interfaces.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

retained_persistence true

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
