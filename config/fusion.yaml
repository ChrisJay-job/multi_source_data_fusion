algorithmVersion: "mvp-0.1.0+task008-3d"
configVersion: "mvp-0.1.0+task008-3d"
noiseCalibrated: false
origin:
  latitude: 39.13
  longitude: 117.20
  comment: "天津一带经验原点，未用未知高度做三维椭球转换"
kalman:
  q_pos: 2.0
  q_vel: 1.5
  r_rid: 8.0
  r_spectrum: 25.0
  r_radar: 40.0
gates:
  identity_dt_s: 8.0
  identity_dist_m: 250.0
  radar_dt_s: 6.0
  radar_dist_m: 180.0
  radar_innov_m: 120.0
  confirm_hits: 1  # first accepted gated bind confirms; raise for multi-frame confirmation
  ambiguity_ratio: 1.15
lifecycle:
  tentative_to_tracked: 3
  coast_s: 4.0
  lost_s: 12.0
  terminate_s: 30.0
  predict_horizon_s: 4.0
rid_fresh_s: 2.5
reorder_window_s: 2.0
# Same-event-time main position source preference (stable; input array order must not win).
primary_source_order: [rid, spectrum, radar]
# Idle recycle (last activity). Active sessions are not dropped solely for age.
session_idle_ttl_s: 3600
# Optional hard max lifetime from create; omit or null to disable.
# session_max_lifetime_s: 86400
session_ttl_s: 3600  # legacy alias → idle TTL
track_ttl_s: 600
idempotency_ttl_s: 1800
max_tracks: 400
max_cache: 200
speed_unit: m_s
heading:
  valid_min: 0.0
  valid_max: 360.0
  exclusive_max: true
altitude:
  sentinel_candidates: [-2]
  unknown_datum: true
sources:
  tj-rid: rid
  tj-pp: spectrum
  tj-leida: radar
multisensor_v1:
  # positionStdM is a standard deviation in metres. The KF measurement
  # covariance uses variance = std^2. These defaults are uncalibrated.
  position_std_m:
    rid: 8.0
    spectrum: 25.0
    radar: 40.0
  position_std_uncalibrated: true
  r_definition: variance
  variance_floor_std_m: 1.0
  gate_m: 80.0
  ambiguity_ratio: 1.15
  confirm_distinct_times: 3
  bind_confirm_times: 2
  primary_fresh_s: 4.0
  # Without scanId, same-detector observations in one bucket compete as one
  # group. The bucket is not a cross-device identity.
  noscan_bucket_ms: 50
  # A named scan is committed once. A different device local id on that scan
  # inside this window is scan_closed. The same local id may continue, and the
  # scan id may be reused after the window. The map itself is capped.
  closed_scan_reject_s: 4.0
  max_closed_scans: 4096
  max_seen: 20000
  max_distinct_times: 32
  max_bind_times: 8
  max_binds_per_track: 24
  max_consumed: 64
  # Remembered batch ids (live cache + evicted). Further new batches are
  # rejected with idempotency_capacity instead of being forgotten in-window.
  # Size for ~5 Hz new batches * idempotency_ttl_s(1800) * margin:
  #   5 * 1800 * 1.5 ≈ 13500 → use 24576+ so a 30min window does not trip capacity.
  max_idempotency_ids: 24576
  hover_speed_mps: 1.5
  heading_gate_deg: 70.0
  coast_s: 4.0
  lost_s: 12.0
  terminate_s: 30.0
  predict_horizon_s: 4.0
  future_skew_s: 2.0
  merge_gate_m: 30.0
  merge_min_times: 3
  max_observations_per_request: 5000
  max_replay_observations: 20000
  trajectory_batch_cap: 500
  committed_history_cap: 80
  primary_source_order: [rid, spectrum, radar]

# Independent vertical KF for multisensor-3d-v1 (MSL metres). Engineering defaults.
multisensor_3d_v1:
  q_alt: 1.0
  q_vspeed: 0.5
  altitude_std_m:
    rid: 5.0
    spectrum: 15.0
    radar: 25.0
  altitude_innov_m: 80.0
  altitude_predict_horizon_s: 4.0
  mapping_version: database_altitude_msl_v1
