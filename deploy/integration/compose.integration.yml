# Template; place under <repo>/deploy/integration/ before using.
services:
  fusion-core:
    image: ${FUSION_IMAGE:-fusion-integration:local}
    build:
      context: ../..
      dockerfile: deploy/integration/Dockerfile.integration
    env_file: .env.integration
    environment:
      PYTHONPATH: /app/src
      TASK008_HTTP_BASE: http://fusion-core:8000
    ports:
      - "${FUSION_BIND_IP:-127.0.0.1}:${FUSION_HTTP_PORT:-18099}:8000"
    volumes:
      - "${FUSION_DATA_DIR:-./data}:/app/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  fusion-mqtt-adapter:
    profiles: [mqtt]
    image: ${FUSION_IMAGE:-fusion-integration:local}
    command: ["python", "-m", "fusion_mvp.integration"]
    env_file: .env.integration
    environment:
      PYTHONPATH: /app/src
      TASK008_HTTP_BASE: http://fusion-core:8000
      TASK008_SQLITE_PATH: /app/data/task008/mqtt_adapter.sqlite3
    volumes:
      - "${FUSION_DATA_DIR:-./data}:/app/data"
    depends_on:
      fusion-core:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
